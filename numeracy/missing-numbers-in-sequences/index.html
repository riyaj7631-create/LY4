<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fbffff">
<title>Number Neighbourhood</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;color:#26354b;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:manipulation}
.screen{display:none;width:100%;height:100%;height:100dvh;overflow:hidden}
.screen.active{display:flex;flex-direction:column}

/* COVER PAGE */
#cover{
 background-color:#fbffff;
 background-image:linear-gradient(rgba(99,183,177,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(99,183,177,.18) 1px,transparent 1px);
 background-size:18px 18px;
 align-items:center;justify-content:center;padding:12px;
}
.cover-layout{width:min(100%,1050px);height:100%;display:grid;grid-template-columns:42% 58%;align-items:center;gap:0}
.cover-art{position:relative;height:min(74vh,390px);min-height:160px;display:flex;align-items:center;justify-content:center}
.notebook{width:78%;height:82%;border:5px solid #273d48;border-radius:7px;background:#5ba9a6;padding:12px;transform:rotate(-4deg);box-shadow:3px 4px 0 #263944}
.paper{width:100%;height:100%;background-color:#fff;background-image:linear-gradient(rgba(99,183,177,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(99,183,177,.22) 1px,transparent 1px);background-size:13px 13px;border:2px solid #273d48;display:flex;flex-direction:column;align-items:center;justify-content:space-around;font-weight:900}
.paper-title{font-size:clamp(14px,2.4vw,25px);color:#f4b64e;letter-spacing:2px}
.math-doodles{font-size:clamp(22px,5vw,50px);line-height:1.1}
.math-equation{font-size:clamp(16px,3vw,30px);color:#e5a83e}
.calculator{position:absolute;width:27%;min-width:55px;right:0;bottom:5%;transform:rotate(-8deg);padding:8px 6px;background:#5ba9a6;border:3px solid #273d48;border-radius:12px;box-shadow:2px 3px 0 #263944}
.calc-screen{background:#d7e4bb;border:2px solid #273d48;border-radius:4px;text-align:right;padding:5px 3px;font-family:monospace;font-size:clamp(12px,2vw,19px);margin-bottom:6px}
.calc-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.calc-buttons i{height:clamp(9px,2vw,18px);background:#f4dba0;border:1.5px solid #273d48;border-radius:3px}
.cover-copy{text-align:center;padding:8px 0;min-width:0}
.cover-kicker{display:inline-block;color:#fff;background:#ef8d9e;border:2px solid #293c49;border-radius:12px;padding:4px 13px;font-size:clamp(17px,4vw,36px);font-weight:1000;letter-spacing:2px;transform:rotate(-5deg);text-shadow:1px 2px #273d48;box-shadow:2px 3px 0 #273d48}
.cover-title{margin:clamp(14px,3vh,26px) 0 0;color:#50a99a;font-weight:1000;font-size:clamp(29px,6.4vw,68px);line-height:.98;letter-spacing:-1px;text-shadow:2px 3px 0 #273d48,-1px -1px 0 #273d48;overflow-wrap:anywhere}
.cover-subtitle{margin:14px 0 0;color:#43566a;font-size:clamp(12px,2.3vw,20px);font-weight:800}
.cover-decor{position:absolute;font-size:clamp(27px,5vw,54px);filter:drop-shadow(1px 2px 0 #fff)}
.paperclip{right:4%;top:3%;transform:rotate(18deg)}
.ruler{right:8%;bottom:2%;transform:rotate(-18deg)}
.cover-start{margin-top:clamp(14px,3vh,26px);border:2px solid #273d48;border-radius:18px;padding:12px 27px;background:#ffd36f;color:#263747;font-weight:900;font-size:clamp(16px,3vw,23px);box-shadow:0 4px 0 #273d48;cursor:pointer}
.cover-start:active{transform:translateY(3px);box-shadow:0 1px 0 #273d48}

/* GAME SCREEN */
#game{padding:10px 14px 14px;background:linear-gradient(180deg,#fff9e9,#f1f9ff);gap:8px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}
.brand{font-size:clamp(14px,3vw,23px);font-weight:900;color:#5b51c9}
.progress{background:#fff;border:2px solid #e5defd;border-radius:20px;padding:7px 10px;font-size:clamp(11px,2.5vw,16px);font-weight:bold;white-space:nowrap}
.progress-track{height:8px;background:#e8e5f5;border-radius:10px;overflow:hidden;flex-shrink:0}
#progressFill{height:100%;width:0;background:#7cce8a;border-radius:10px;transition:width .25s}
.instruction{text-align:center;flex-shrink:0}
.instruction h1{margin:2px 0 3px;font-size:clamp(21px,4.4vw,34px);color:#5144b7}
.instruction p{margin:0;font-size:clamp(12px,2.6vw,17px);color:#657087}
.scene{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}
.street{width:min(100%,620px);display:flex;align-items:center;justify-content:center;gap:clamp(5px,2.5vw,18px)}
.house{position:relative;flex:1;max-width:155px;min-width:0;aspect-ratio:.88;max-height:28vh;background:#ffe29b;border:3px solid #e9ae55;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-top:22px;box-shadow:0 4px 0 #e9c681}
.house:nth-child(2){background:#c9edff;border-color:#76c8e8;box-shadow:0 4px 0 #a6d8eb}
.house:nth-child(3){background:#d7f5cf;border-color:#94cf85;box-shadow:0 4px 0 #b5dda9}
.roof{position:absolute;top:-25px;left:8%;width:84%;height:28px;background:#ff947f;clip-path:polygon(50% 0,100% 100%,0 100%)}
.house:nth-child(2) .roof{background:#9b8bf3}
.house:nth-child(3) .roof{background:#ffb95e}
.house-label{position:absolute;top:7px;left:0;width:100%;text-align:center;font-size:clamp(10px,2vw,14px);font-weight:bold;color:#566077}
.house-number{font-size:clamp(28px,8vw,64px);font-weight:900;color:#34415b;line-height:1}
.missing{color:#5c4bd0;background:#fff;border:3px dashed #7d70dc;border-radius:12px;width:78%;height:62%;display:flex;align-items:center;justify-content:center}
.options{width:min(100%,620px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(7px,2vw,15px)}
.option{min-width:0;min-height:58px;height:clamp(60px,13vh,100px);border:3px solid #c9c1f6;border-radius:17px;background:#fff;color:#5144b7;font-size:clamp(25px,6vw,43px);font-weight:900;box-shadow:0 5px 0 #e0daf9;cursor:pointer}
.option:active{transform:scale(.96)}
.option:disabled{cursor:default}
.option.wrong{animation:jiggle .32s ease-in-out;border-color:#f39b9b;background:#fff0f0}
.option.hint{animation:glow 1s ease-in-out infinite alternate;border-color:#ffbd43}
.option.correct{background:#d7f8dc;border-color:#58bd70;color:#208744;box-shadow:0 0 0 3px #b2edbe}
@keyframes jiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px) rotate(-2deg)}50%{transform:translateX(5px) rotate(2deg)}75%{transform:translateX(-3px)}}
@keyframes glow{from{box-shadow:0 0 5px #ffd76c}to{box-shadow:0 0 20px #ffb51c,0 0 28px #ffe6a0}}
.feedback{flex-shrink:0;height:36px;display:flex;justify-content:center;align-items:center;font-size:clamp(16px,3.8vw,26px);font-weight:900;color:#208744;text-align:center}
#feedback:empty{visibility:hidden}

/* FINAL CELEBRATION */
#finish{position:relative;background:#fff;align-items:center;justify-content:center;text-align:center;padding:20px}
.finish-content{z-index:2}
.trophy{font-size:clamp(55px,14vw,100px);margin-bottom:4px}
#finish h1{font-size:clamp(40px,10vw,70px);color:#38a95d;margin:5px 0 12px}
#finish p{font-size:clamp(17px,4vw,24px);margin:0 0 25px;color:#59657a}
#playAgain{border:0;border-radius:18px;padding:15px 32px;min-height:58px;background:#6356d8;color:white;font-size:clamp(18px,4vw,24px);font-weight:bold;box-shadow:0 5px 0 #4338a8;cursor:pointer}
#playAgain:active{transform:translateY(3px);box-shadow:0 2px 0 #4338a8}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

@media(max-width:520px){
 .cover-layout{grid-template-columns:38% 62%}
 .notebook{width:86%;height:72%;padding:7px;border-width:3px}
 .cover-art{height:min(54vh,300px)}
 .calculator{right:-2%;bottom:8%;min-width:45px;padding:6px 4px}
 .cover-title{font-size:clamp(25px,7vw,42px)}
 .cover-kicker{font-size:clamp(14px,4vw,22px);padding:4px 7px}
 .cover-subtitle{font-size:11px}
 .cover-decor{font-size:26px}
}
@media(max-height:600px){
 #game{padding:5px 10px 7px;gap:4px}
 .instruction h1{margin:0}
 .scene{gap:7px}
 .house{max-height:25vh;margin-top:17px}
 .roof{top:-19px;height:22px}
 .option{height:58px;min-height:52px}
 .feedback{height:28px}
 .progress-track{height:6px}
 .cover-art{height:78vh;min-height:0}
 .cover-title{margin-top:10px}
 .cover-start{margin-top:10px;padding:8px 20px}
 .cover-subtitle{margin-top:7px}
}
@media(max-width:360px){
 #game{padding-left:8px;padding-right:8px}
 .house{border-width:2px;border-radius:9px}
 .street{gap:5px}
 .option{border-radius:12px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- COVER PAGE -->
<section id="cover" class="screen active" aria-label="Number Neighbourhood cover">
 <div class="cover-layout">
  <div class="cover-art" aria-hidden="true">
   <div class="notebook"><div class="paper">
    <div class="paper-title">MATHS</div>
    <div class="math-doodles">△　▱<br>◇　△</div>
    <div class="math-equation">1 2 3　+　?</div>
   </div></div>
   <div class="calculator"><div class="calc-screen">1234</div><div class="calc-buttons"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
   <div class="cover-decor paperclip">📎</div>
   <div class="cover-decor ruler">📐</div>
  </div>
  <div class="cover-copy">
   <div class="cover-kicker">MATHS</div>
   <h1 class="cover-title">Number<br>Neighbourhood</h1>
   <p class="cover-subtitle">Find the missing number!</p>
   <button class="cover-start" id="startGame" type="button">Let's Play! ▶</button>
  </div>
 </div>
</section>

<!-- GAME -->
<section id="game" class="screen" aria-label="Number game">
 <div class="topbar">
  <div class="brand">🏡 Number Neighbourhood</div>
  <div class="progress" id="counter">Question 1 / 20</div>
 </div>
 <div class="progress-track"><div id="progressFill"></div></div>
 <div class="instruction">
  <h1>Find the Missing Number!</h1>
  <p>Which number belongs in the empty house?</p>
 </div>
 <div class="scene">
  <div class="street">
   <div class="house"><div class="roof"></div><div class="house-label">Neighbour</div><div class="house-number" id="leftNumber">12</div></div>
   <div class="house"><div class="roof"></div><div class="house-label">Missing!</div><div class="house-number missing" id="middleNumber">?</div></div>
   <div class="house"><div class="roof"></div><div class="house-label">Neighbour</div><div class="house-number" id="rightNumber">14</div></div>
  </div>
  <div class="options" id="options"></div>
 </div>
 <div class="feedback" id="feedback" aria-live="polite"></div>
</section>

<!-- GOOD JOB -->
<section id="finish" class="screen" aria-label="Game complete">
 <canvas id="confetti"></canvas>
 <div class="finish-content">
  <div class="trophy">🏆</div>
  <h1>Good Job!</h1>
  <p>You are a Number Neighbourhood Star!</p>
  <button id="playAgain" type="button">↻ Play Again</button>
 </div>
</section>

<!-- Keep assets folder beside this index.html file -->
<audio id="clapSound" preload="auto"><source src="assets/claps.mp3" type="audio/mpeg"></audio>
<audio id="wrongSound" preload="auto"><source src="assets/wrong.mp3" type="audio/mpeg"></audio>

<script>
(function(){
 "use strict";
 const TOTAL_QUESTIONS=20,MIN_NUMBER=1,MAX_NUMBER=50;
 const cover=document.getElementById("cover"),game=document.getElementById("game"),finish=document.getElementById("finish");
 const counter=document.getElementById("counter"),fill=document.getElementById("progressFill");
 const leftNumber=document.getElementById("leftNumber"),middleNumber=document.getElementById("middleNumber"),rightNumber=document.getElementById("rightNumber");
 const optionsBox=document.getElementById("options"),feedback=document.getElementById("feedback");
 const clapSound=document.getElementById("clapSound"),wrongSound=document.getElementById("wrongSound");
 let questions=[],questionIndex=0,wrongAttempts=0,locked=false,nextTimer=null,runId=0,confettiFrame=null;

 function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
 }
 function makeQuestions(){
  const pool=[];
  for(let n=MIN_NUMBER+1;n<MAX_NUMBER;n++)pool.push({left:n-1,answer:n,right:n+1});
  return shuffle(pool).slice(0,TOTAL_QUESTIONS);
 }
 function showScreen(target){
  [cover,game,finish].forEach(s=>s.classList.toggle("active",s===target));
 }
 function playSound(audio){
  try{audio.currentTime=0;const p=audio.play();if(p&&p.catch)p.catch(function(){});}catch(e){}
 }
 function stopTimer(){if(nextTimer!==null){clearTimeout(nextTimer);nextTimer=null;}}
 function startGame(){
  stopTimer();runId++;questionIndex=0;wrongAttempts=0;locked=false;questions=makeQuestions();
  showScreen(game);renderQuestion();
 }
 function renderQuestion(){
  if(questionIndex>=questions.length){showFinish();return;}
  locked=false;wrongAttempts=0;feedback.textContent="";
  const q=questions[questionIndex];
  leftNumber.textContent=q.left;middleNumber.textContent="?";middleNumber.classList.add("missing");rightNumber.textContent=q.right;
  counter.textContent="Question "+(questionIndex+1)+" / "+questions.length;
  fill.style.width=(questionIndex/questions.length*100)+"%";
  const choices=new Set([q.answer]);
  while(choices.size<3){
   const candidate=q.answer+Math.floor(Math.random()*9)-4;
   if(candidate>=MIN_NUMBER&&candidate<=MAX_NUMBER&&candidate!==q.answer)choices.add(candidate);
  }
  optionsBox.innerHTML="";
  shuffle(Array.from(choices)).forEach(function(value){
   const button=document.createElement("button");
   button.type="button";button.className="option";button.textContent=value;
   button.setAttribute("aria-label","Choose "+value);
   button.addEventListener("click",function(){checkAnswer(value,button);});
   optionsBox.appendChild(button);
  });
 }
 function checkAnswer(value,button){
  if(locked)return;
  const q=questions[questionIndex];
  if(value===q.answer){
   locked=true;playSound(clapSound);
   middleNumber.textContent=q.answer;middleNumber.classList.remove("missing");
   button.classList.add("correct");button.textContent="✓ "+value;
   feedback.textContent="✓ Excellent! Well done!";feedback.style.color="#208744";
   optionsBox.querySelectorAll("button").forEach(function(b){b.disabled=true;});
   fill.style.width=((questionIndex+1)/questions.length*100)+"%";
   const thisRun=runId;
   nextTimer=setTimeout(function(){if(thisRun!==runId)return;questionIndex++;renderQuestion();},1000);
  }else{
   wrongAttempts++;playSound(wrongSound);
   button.classList.remove("wrong");void button.offsetWidth;button.classList.add("wrong");
   feedback.textContent="Try again! You can do it!";feedback.style.color="#d65b5b";
   if(wrongAttempts>=2){
    optionsBox.querySelectorAll("button").forEach(function(b){
     b.classList.remove("hint");
     if(Number(b.textContent)===q.answer)b.classList.add("hint");
    });
   }
  }
 }
 function showFinish(){stopTimer();showScreen(finish);launchConfetti();}
 function launchConfetti(){
  const canvas=document.getElementById("confetti"),ctx=canvas.getContext("2d");if(!ctx)return;
  if(confettiFrame)cancelAnimationFrame(confettiFrame);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(canvas.clientWidth*dpr);canvas.height=Math.round(canvas.clientHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=canvas.clientWidth,h=canvas.clientHeight;
  const colors=["#ff7272","#ffd166","#70d6ff","#a78bfa","#80ed99","#ff9fcb"];
  const pieces=[];
  for(let i=0;i<100;i++)pieces.push({x:Math.random()*w,y:-Math.random()*h,size:4+Math.random()*7,speed:1.5+Math.random()*3,drift:(Math.random()-.5)*2,angle:Math.random()*6,spin:(Math.random()-.5)*.15,color:colors[i%colors.length]});
  let frames=0;
  function draw(){
   ctx.clearRect(0,0,w,h);
   pieces.forEach(function(p){
    p.y+=p.speed;p.x+=p.drift;p.angle+=p.spin;
    if(p.y>h+10){p.y=-10;p.x=Math.random()*w;}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.65);ctx.restore();
   });
   frames++;
   if(frames<900&&finish.classList.contains("active"))confettiFrame=requestAnimationFrame(draw);
  }
  draw();
 }
 document.getElementById("playAgain").addEventListener("click",function(){
  if(confettiFrame){cancelAnimationFrame(confettiFrame);confettiFrame=null;}
  const c=document.getElementById("confetti"),ctx=c.getContext("2d");if(ctx)ctx.clearRect(0,0,c.width,c.height);
  startGame();
 });
 document.getElementById("startGame").addEventListener("click",startGame);
 window.addEventListener("resize",function(){if(finish.classList.contains("active"))launchConfetti();});
})();
</script>
</body>
</html>
