
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#9be8ff">
<title>Where Does It Go? – Transportation Game</title>
<style>
:root{--blue:#1d4e73;--sky:#c9f3ff;--yellow:#ffd95c;--green:#67d88c;--pink:#ff91b7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:#bcefff;touch-action:manipulation}
button{font:inherit;cursor:pointer}
.screen{position:fixed;inset:0;width:100%;height:100%;height:100dvh;display:none;align-items:center;justify-content:center;overflow:hidden}
.screen.active{display:flex}
#startScreen{flex-direction:column;padding:14px;text-align:center;background:linear-gradient(180deg,#8ee0ff 0%,#dff8ff 62%,#a6e57e 63%,#83cf62 100%)}
.start-cloud{position:absolute;font-size:clamp(3rem,11vw,6rem);opacity:.9;pointer-events:none;animation:float 5s ease-in-out infinite alternate}
.cloud-left{left:2%;top:4%}.cloud-right{right:2%;top:10%}
.start-card{position:relative;z-index:2;width:min(94vw,670px);max-height:94vh;padding:clamp(15px,4vw,36px);border:5px solid white;border-radius:30px;background:#ffffffed;box-shadow:0 12px 28px #1a537833;display:flex;flex-direction:column;align-items:center;justify-content:center}
.small-heading{padding:7px 17px;border-radius:999px;background:#fff0ae;color:#8c6300;font-size:clamp(.85rem,3vw,1.15rem);font-weight:900}
.main-title{margin:12px 0 4px;color:var(--blue);font-size:clamp(2rem,8vw,4.4rem);line-height:1;font-weight:900;text-shadow:0 4px 0 #d3f0ff}
.start-instruction{margin:8px 0 12px;color:#50728a;font-size:clamp(.95rem,3.5vw,1.35rem);font-weight:700}
.preview-container{width:100%;display:flex;justify-content:center;gap:clamp(6px,3vw,22px);margin:5px 0 18px}
.preview-box{width:clamp(78px,25vw,150px);padding:10px 4px;border-radius:22px;box-shadow:0 7px 0 #1b49651a}
.preview-box span:first-child{display:block;font-size:clamp(2.6rem,11vw,5rem);animation:bounce 2s ease-in-out infinite}
.preview-box:nth-child(2) span:first-child{animation-delay:.3s}.preview-box:nth-child(3) span:first-child{animation-delay:.6s}
.preview-box span:last-child{display:block;margin-top:4px;color:#315774;font-size:clamp(.78rem,3vw,1rem);font-weight:900}
.preview-sky{background:#caf0ff}.preview-water{background:#aee3f7}.preview-road{background:#dce4e8}
.main-button{min-width:min(75vw,310px);min-height:60px;border:0;border-radius:999px;padding:13px 28px;background:linear-gradient(#ffe682,#ffc739);color:#614000;box-shadow:0 7px 0 #df9b20;font-size:clamp(1.25rem,5vw,2rem);font-weight:900}
.main-button:active{transform:translateY(4px);box-shadow:0 3px 0 #df9b20}
#gameScreen{flex-direction:column;justify-content:flex-start;padding:clamp(6px,2vw,16px);background:linear-gradient(#a9e9ff,#e9fbff)}
.game-header{width:min(100%,1100px);height:clamp(44px,8vh,68px);display:flex;align-items:center;justify-content:space-between;gap:7px;flex-shrink:0}
.progress{padding:7px 10px;border:3px solid white;border-radius:999px;background:#ffffffed;color:var(--blue);box-shadow:0 6px 14px #205e8522;font-size:clamp(.75rem,2.8vw,1.1rem);font-weight:900;white-space:nowrap}
.game-title{color:var(--blue);font-size:clamp(.85rem,3.5vw,1.5rem);font-weight:900;text-align:center}
.sound-button{width:clamp(43px,11vw,56px);height:clamp(43px,11vw,56px);flex-shrink:0;border:3px solid white;border-radius:50%;background:white;box-shadow:0 6px 14px #205e8522;font-size:clamp(1.2rem,5vw,1.8rem)}
.question-panel{position:relative;width:min(100%,900px);min-height:clamp(135px,27vh,225px);margin:3px auto 7px;padding:10px 50px;flex-shrink:0;border:5px solid white;border-radius:28px;background:#ffffffed;box-shadow:0 12px 28px #1a537833;display:flex;flex-direction:column;align-items:center;justify-content:center}
.question-text{margin-bottom:4px;color:#4a718c;font-size:clamp(.9rem,3.2vw,1.2rem);font-weight:900;text-align:center}
.vehicle-card{display:flex;flex-direction:column;align-items:center;justify-content:center;transform-origin:center}
.vehicle-picture{min-height:70px;display:flex;align-items:center;justify-content:center;font-size:clamp(3.8rem,16vw,7.7rem);line-height:1;filter:drop-shadow(0 8px 5px #17446433);animation:float 1.7s ease-in-out infinite}
.vehicle-label{margin-top:4px;padding:4px 18px;border-radius:999px;background:#ecf8ff;color:var(--blue);font-size:clamp(1rem,4.5vw,1.8rem);font-weight:900;text-transform:lowercase}
.listen-button{position:absolute;top:9px;right:9px;width:clamp(40px,10vw,52px);height:clamp(40px,10vw,52px);border:0;border-radius:50%;background:#fff0a5;box-shadow:0 4px 0 #dfb637;font-size:clamp(1.1rem,4vw,1.5rem)}
.feedback{min-height:28px;margin:0;flex-shrink:0;color:#246695;font-size:clamp(.95rem,3.7vw,1.3rem);font-weight:900;text-align:center}
.zones{width:min(100%,1100px);flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,2vw,16px);padding-bottom:2px}
.zone{position:relative;min-width:0;min-height:0;border:4px solid white;border-radius:24px;padding:8px 4px;background:#ffffffd9;box-shadow:0 8px 16px #205e8522;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.zone-icon{font-size:clamp(2rem,7vw,4rem);line-height:1.1}
.zone-title{margin:3px 0 6px;color:var(--blue);font-size:clamp(.8rem,3vw,1.35rem);font-weight:900;text-align:center}
.zone.sky{background:linear-gradient(#d5f5ff,#9be5ff)}
.zone.water{background:linear-gradient(#d4f5ff,#85d8f5)}
.zone.road{background:linear-gradient(#f2f5f7,#cfd9df)}
.parade{width:100%;display:flex;align-content:flex-start;justify-content:center;align-items:center;flex-wrap:wrap;gap:2px;overflow:hidden}
.placed-vehicle{font-size:clamp(1rem,4vw,2rem);line-height:1.2;animation:pop .3s ease-out}
.zone.wrong{animation:shake .35s ease-in-out;border-color:#ff6b79}
.zone.hint{animation:glow .7s ease-in-out infinite alternate;border-color:#ffd34e}
.zone.correct{border-color:#39bd69;box-shadow:0 0 0 4px #67d88c88,0 0 20px #67d88c}
#endScreen{flex-direction:column;text-align:center;padding:20px;background:linear-gradient(180deg,#fff,#e8faff)}
.end-card{position:relative;z-index:2;width:min(92vw,620px);padding:clamp(20px,5vw,40px);border:5px solid white;border-radius:30px;background:#ffffffed;box-shadow:0 12px 28px #1a537833}
.end-stars{font-size:clamp(2rem,8vw,4rem);margin:5px}
.end-title{margin:8px 0;color:#269653;font-size:clamp(2.5rem,10vw,5rem);font-weight:900}
.end-message{color:#50728a;font-size:clamp(1rem,4vw,1.5rem);font-weight:800}
#playAgainButton{margin-top:15px;min-height:58px;padding:12px 30px;border:0;border-radius:999px;background:linear-gradient(#ffe682,#ffc739);color:#614000;box-shadow:0 6px 0 #df9b20;font-size:clamp(1.2rem,4vw,1.7rem);font-weight:900}
#confettiContainer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti{position:absolute;top:-15px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-7px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes glow{from{box-shadow:0 0 4px #ffd34e}to{box-shadow:0 0 22px #ffbf28}}
.disappear{animation:vanish .25s forwards}
@keyframes vanish{to{opacity:0;transform:scale(.6)}}
@media(max-height:520px){.start-card{padding:10px 18px}.main-title{margin:6px 0;font-size:clamp(1.7rem,6vw,3rem)}.start-instruction{margin:4px}.preview-container{margin:3px 0 9px}.preview-box{padding:5px}.main-button{min-height:48px}.question-panel{min-height:115px;margin:2px auto 4px;padding:6px 42px}.vehicle-picture{min-height:48px;font-size:clamp(3rem,12vh,5rem)}.game-header{height:42px}.zone{border-width:2px;border-radius:15px}.zone-icon{font-size:clamp(1.6rem,6vh,2.8rem)}.zone-title{margin:2px 0;font-size:clamp(.7rem,2.5vh,1rem)}.feedback{min-height:23px}}
@media(max-width:360px){.question-panel{padding-left:36px;padding-right:36px}.zones{gap:4px}.zone{border-radius:13px}.zone-title{font-size:.72rem}.progress{padding:6px 7px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- START SCREEN: NO LOGO PAGE -->
<section id="startScreen" class="screen active">
 <div class="start-cloud cloud-left">☁️</div>
 <div class="start-cloud cloud-right">☁️</div>
 <div class="start-card">
  <div class="small-heading">🚦 LET'S LEARN ABOUT TRANSPORT 🚦</div>
  <h1 class="main-title">Where Does<br>It Go?</h1>
  <p class="start-instruction">Help each vehicle find its correct place!</p>
  <div class="preview-container">
   <div class="preview-box preview-sky"><span>✈️</span><span>Sky</span></div>
   <div class="preview-box preview-water"><span>🚢</span><span>Water</span></div>
   <div class="preview-box preview-road"><span>🚗</span><span>Road</span></div>
  </div>
  <button id="startButton" class="main-button">Let's Play! ▶</button>
 </div>
</section>

<!-- GAME SCREEN -->
<section id="gameScreen" class="screen">
 <header class="game-header">
  <div class="progress" id="progress">1 / 12</div>
  <div class="game-title">🚦 Where Does It Go?</div>
  <button id="soundButton" class="sound-button" aria-label="Toggle sound">🔊</button>
 </header>
 <div class="question-panel">
  <div class="question-text">Where does this vehicle travel?</div>
  <button id="listenButton" class="listen-button" aria-label="Repeat question">🔁</button>
  <div id="vehicleCard" class="vehicle-card">
   <div id="vehiclePicture" class="vehicle-picture">✈️</div>
   <div id="vehicleLabel" class="vehicle-label">aeroplane</div>
  </div>
 </div>
 <p id="feedback" class="feedback" aria-live="polite">Choose the correct place.</p>
 <div class="zones">
  <button class="zone sky" data-category="sky">
   <span class="zone-icon">☁️</span><span class="zone-title">SKY</span><div class="parade" id="skyParade"></div>
  </button>
  <button class="zone water" data-category="water">
   <span class="zone-icon">🌊</span><span class="zone-title">WATER</span><div class="parade" id="waterParade"></div>
  </button>
  <button class="zone road" data-category="road">
   <span class="zone-icon">🛣️</span><span class="zone-title">ROAD</span><div class="parade" id="roadParade"></div>
  </button>
 </div>
</section>

<!-- FINAL SCREEN -->
<section id="endScreen" class="screen">
 <div id="confettiContainer"></div>
 <div class="end-card">
  <div class="end-stars" id="stars">⭐⭐⭐</div>
  <h1 class="end-title">Good Job!</h1>
  <p class="end-message" id="scoreMessage">Amazing work!</p>
  <p>You helped the vehicles find their places!</p>
  <button id="playAgainButton">↻ Play Again</button>
 </div>
</section>

<!-- Asset paths relative to LY4/theme/transportation/index.html -->
<audio id="wrongAudio" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="clapAudio" src="assets/claps.mp3" preload="auto"></audio>

<script>
(function(){
"use strict";

const allScreens=[document.getElementById("startScreen"),document.getElementById("gameScreen"),document.getElementById("endScreen")];
const startButton=document.getElementById("startButton");
const playAgainButton=document.getElementById("playAgainButton");
const listenButton=document.getElementById("listenButton");
const soundButton=document.getElementById("soundButton");
const progress=document.getElementById("progress");
const vehicleCard=document.getElementById("vehicleCard");
const vehiclePicture=document.getElementById("vehiclePicture");
const vehicleLabel=document.getElementById("vehicleLabel");
const feedback=document.getElementById("feedback");
const zones=Array.from(document.querySelectorAll(".zone"));
const wrongAudio=document.getElementById("wrongAudio");
const clapAudio=document.getElementById("clapAudio");
const stars=document.getElementById("stars");
const scoreMessage=document.getElementById("scoreMessage");

const paradeAreas={
 sky:document.getElementById("skyParade"),
 water:document.getElementById("waterParade"),
 road:document.getElementById("roadParade")
};

const vehicleBank=[
 {name:"aeroplane",picture:"✈️",category:"sky"},
 {name:"helicopter",picture:"🚁",category:"sky"},
 {name:"hot-air balloon",picture:"🎈",category:"sky"},
 {name:"rocket",picture:"🚀",category:"sky"},
 {name:"boat",picture:"🛶",category:"water"},
 {name:"ship",picture:"🚢",category:"water"},
 {name:"ferry",picture:"⛴️",category:"water"},
 {name:"submarine",picture:"🚤",category:"water"},
 {name:"car",picture:"🚗",category:"road"},
 {name:"bus",picture:"🚌",category:"road"},
 {name:"bicycle",picture:"🚲",category:"road"},
 {name:"truck",picture:"🚚",category:"road"}
];

let questions=[],currentQuestion=0,attempts=0,score=0,interactionLocked=false,soundMuted=false;
let audioContext=null,melodyGain=null,melodyTimer=null,melodyStep=0;

function showScreen(screen){
 allScreens.forEach(s=>s.classList.toggle("active",s===screen));
}
function shuffle(array){
 for(let i=array.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [array[i],array[j]]=[array[j],array[i]];
 }
 return array;
}
function playAudio(audio){
 if(soundMuted)return;
 try{audio.currentTime=0;const p=audio.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
}
function resetAudio(audio){
 try{audio.pause();audio.currentTime=0;}catch(e){}
}
function speak(text){
 if(soundMuted||!("speechSynthesis" in window))return;
 try{
  window.speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.rate=.88;utterance.pitch=1.1;
  window.speechSynthesis.speak(utterance);
 }catch(e){}
}
function speakCurrentQuestion(){
 const item=questions[currentQuestion];
 if(item)speak("Where does the "+item.name+" travel? Choose sky, water, or road.");
}

/* Gentle optional background melody, generated locally without downloads. */
function initialiseMelody(){
 if(soundMuted||!window.AudioContext)return;
 try{
  if(!audioContext)audioContext=new AudioContext();
  if(audioContext.state==="suspended")audioContext.resume();
  if(!melodyGain){
   melodyGain=audioContext.createGain();
   melodyGain.gain.value=.025;
   melodyGain.connect(audioContext.destination);
  }
 }catch(e){}
}
function startMelody(){
 initialiseMelody();
 if(!audioContext||melodyTimer)return;
 const notes=[523.25,659.25,587.33,783.99,659.25,587.33,523.25,392];
 melodyTimer=setInterval(()=>{
  if(soundMuted||!audioContext||!melodyGain)return;
  try{
   const osc=audioContext.createOscillator();
   const gain=audioContext.createGain();
   osc.type="sine";osc.frequency.value=notes[melodyStep%notes.length];
   gain.gain.setValueAtTime(.0001,audioContext.currentTime);
   gain.gain.exponentialRampToValueAtTime(.045,audioContext.currentTime+.04);
   gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.3);
   osc.connect(gain);gain.connect(melodyGain);
   osc.start();osc.stop(audioContext.currentTime+.32);
   melodyStep++;
  }catch(e){}
 },420);
}
function stopMelody(){
 if(melodyTimer){clearInterval(melodyTimer);melodyTimer=null;}
}

function resetGame(){
 currentQuestion=0;attempts=0;score=0;interactionLocked=false;
 questions=shuffle(vehicleBank.slice());
 Object.values(paradeAreas).forEach(p=>p.innerHTML="");
 zones.forEach(z=>z.classList.remove("wrong","correct","hint"));
 displayQuestion();
}
function displayQuestion(){
 if(currentQuestion>=questions.length){finishGame();return;}
 attempts=0;interactionLocked=false;
 const item=questions[currentQuestion];
 progress.textContent=(currentQuestion+1)+" / "+questions.length;
 vehiclePicture.textContent=item.picture;
 vehicleLabel.textContent=item.name;
 vehicleCard.className="vehicle-card";
 feedback.textContent="Choose the correct place.";
 zones.forEach(z=>z.classList.remove("wrong","correct","hint"));
 setTimeout(()=>speakCurrentQuestion(),350);
}
function clearZoneEffects(){
 zones.forEach(z=>z.classList.remove("wrong","correct","hint"));
}
zones.forEach(zone=>{
 zone.addEventListener("click",()=>{
  checkAnswer(zone.dataset.category,zone);
 });
});
function checkAnswer(selectedCategory,selectedZone){
 if(interactionLocked)return;
 const item=questions[currentQuestion];
 if(!item)return;
 if(selectedCategory===item.category){
  score++;
  completeQuestion(selectedZone,true);
  return;
 }
 attempts++;
 selectedZone.classList.remove("wrong");
 void selectedZone.offsetWidth;
 selectedZone.classList.add("wrong");
 playAudio(wrongAudio);
 setTimeout(()=>selectedZone.classList.remove("wrong"),500);
 if(attempts<2){
  feedback.textContent="Try again!";
  speak("Let us try again.");
  return;
 }
 revealCorrectAnswer();
}
function revealCorrectAnswer(){
 interactionLocked=true;
 const item=questions[currentQuestion];
 const correctZone=zones.find(z=>z.dataset.category===item.category);
 if(!correctZone)return;
 correctZone.classList.add("hint");
 const place=item.category==="sky"?"the sky":item.category;
 feedback.textContent="The "+item.name+" goes in "+place+".";
 speak("The "+item.name+" goes in "+place+".");
 setTimeout(()=>{
  correctZone.classList.remove("hint");
  completeQuestion(correctZone,false);
 },1600);
}
function completeQuestion(correctZone,answeredCorrectly){
 interactionLocked=true;
 const item=questions[currentQuestion];
 correctZone.classList.add("correct");
 vehicleCard.classList.add("disappear");
 playAudio(clapAudio);
 if(answeredCorrectly){
  const messages=["Great job!","Wonderful!","Well done!","You found it!"];
  const message=messages[Math.floor(Math.random()*messages.length)];
  feedback.textContent="✓ "+message;
  speak(message);
 }else{
  feedback.textContent="Let's remember this place.";
 }
 setTimeout(()=>addVehicleToZone(item.category,item.picture,item.name),250);
 setTimeout(()=>{
  currentQuestion++;
  if(currentQuestion>=questions.length)finishGame();
  else displayQuestion();
 },1500);
}
function addVehicleToZone(category,picture,name){
 const parade=paradeAreas[category];
 if(!parade)return;
 const vehicle=document.createElement("span");
 vehicle.className="placed-vehicle";
 vehicle.textContent=picture;
 vehicle.setAttribute("aria-label",name);
 parade.appendChild(vehicle);
}
function finishGame(){
 interactionLocked=true;
 let starResult="⭐",message="Good try!";
 if(score>=10){starResult="⭐⭐⭐";message="Amazing work!";}
 else if(score>=7){starResult="⭐⭐";message="Great work!";}
 else if(score>=4){starResult="⭐";message="Well done for trying!";}
 stars.textContent=starResult;
 scoreMessage.textContent=message;
 showScreen(document.getElementById("endScreen"));
 createConfetti();
 playAudio(clapAudio);
 setTimeout(()=>speak("Wonderful! You helped all the vehicles find their places!"),400);
}
function createConfetti(){
 const container=document.getElementById("confettiContainer");
 container.innerHTML="";
 const colours=["#ff6c98","#ffd34e","#44c8f0","#65d687","#a984ff","#ff9f43"];
 for(let i=0;i<45;i++){
  const piece=document.createElement("span");
  piece.className="confetti";
  piece.style.left=(Math.random()*100)+"%";
  piece.style.background=colours[Math.floor(Math.random()*colours.length)];
  piece.style.animationDuration=(2.8+Math.random()*2.4)+"s";
  piece.style.animationDelay=(Math.random()*.8)+"s";
  container.appendChild(piece);
 }
 setTimeout(()=>container.innerHTML="",6500);
}

startButton.addEventListener("click",()=>{
 wrongAudio.load();clapAudio.load();
 initialiseMelody();startMelody();
 showScreen(document.getElementById("gameScreen"));
 resetGame();
});
playAgainButton.addEventListener("click",()=>{
 showScreen(document.getElementById("gameScreen"));
 resetGame();
});
listenButton.addEventListener("click",speakCurrentQuestion);
soundButton.addEventListener("click",()=>{
 soundMuted=!soundMuted;
 soundButton.textContent=soundMuted?"🔇":"🔊";
 if(soundMuted){
  resetAudio(wrongAudio);resetAudio(clapAudio);
  if("speechSynthesis" in window)window.speechSynthesis.cancel();
  if(melodyGain&&audioContext)melodyGain.gain.setTargetAtTime(0,audioContext.currentTime,.05);
 }else{
  initialiseMelody();
  if(melodyGain&&audioContext)melodyGain.gain.setTargetAtTime(.025,audioContext.currentTime,.05);
  speakCurrentQuestion();
 }
});
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());
})();
</script>
</body>
</html>
